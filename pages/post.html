<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="../assets/img/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/icon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png" />
    <title>Conecta Fatec | Post</title>

  <meta name="apple-mobile-web-app-title" content="Conecta Fatec" />
  <meta name="application-name" content="Conecta Fatec" />
  <meta name="theme-color" content="#0f172a" />

<script>
        /* Bloqueia páginas internas sem login em produção, mas evita erro de segurança ao testar pelo file://. */
        const isLocalPreview = window.location.protocol === 'file:';

        if (!isLocalPreview && !localStorage.getItem('access_token')) {
            window.location.href = '../index.html';
        }
    </script>

  <script src="../assets/js/theme-boot.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/assets/css/style.min.css" />
</head>

<body>

    <main class="feed-page">
        <div class="feed-layout">

<aside class="sidebar desktop-sidebar modern-sidebar">
    <a href="about.html" class="sidebar-logo">
        <img id="sidebarLogo" class="sidebar-logo-svg" src="../assets/img/logo-light.svg"
    data-logo-default="../assets/img/logo-light.svg" data-logo-light="../assets/img/logo-light.svg" data-logo-dark="../assets/img/logo-dark.svg" alt="Conecta Fatec" />
    </a>

    <nav class="sidebar-nav modern-nav">
        <a href="feed.html" class="sidebar-link">
            <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
                fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Feed</span>
        </a>
        <a href="communities.html" class="sidebar-link">
            <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
                fill="none" stroke-linecap="round" stroke-linejoin="round">

                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>

        <a href="friends.html" class="sidebar-link">

                fill="none" stroke-linecap="round" stroke-linejoin="round">

                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            <span>Amizades</span>
        </a>
        <a href="notifications.html" class="sidebar-link">
            <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
                fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Notificações</span>
        </a>
        <a href="settings.html" class="sidebar-link">
            <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            <span>Configurações</span>
        </a>
    </nav>

    <button class="new-post-btn modern-post-btn" type="button" data-bs-toggle="modal" data-bs-target="#newPostModal">
        <span class="btn-text">Novo post</span>
        <svg class="btn-icon" style="display: none;" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
            stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <div class="sidebar-actions modern-sidebar-actions">
        <div class="user-menu-inline">
      <a class="logged-user user-menu-pill user-profile-link" href="profile.html" aria-label="Abrir perfil">
        <div class="user-info-wrapper">
                <div class="user-avatar" id="sidebar-avatar">--</div>
                <div class="user-details">
                    <strong id="sidebar-name">Carregando...</strong>
                    <span id="sidebar-username">@usuario</span>
                </div>
            </div>
      </a>
      <button class="user-options-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Abrir ações do perfil">
        <svg class="more-options-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <circle cx="5" cy="12" r="2.2"></circle>
                <circle cx="12" cy="12" r="2.2"></circle>
                <circle cx="19" cy="12" r="2.2"></circle>
            </svg>
      </button>

        <ul class="dropdown-menu user-dropdown-menu shadow">
            <li>
                <a class="dropdown-item" href="profile.html">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Ver perfil
                </a>
            </li>
            <li>
                <hr class="dropdown-divider">
            </li>
            <li>
                <a class="dropdown-item text-danger" href="../index.html"
                    onclick="localStorage.removeItem('access_token');">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sair da conta
                </a>
            </li>
        </ul>
    </div>
    </div>
</aside>

            <section class="feed-content position-relative">

                <header class="single-post-header">
                    <div class="single-post-title-row">
                        <button class="back-btn" onclick="history.back()" aria-label="Voltar">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                            </svg>
                        </button>
                        <h1 class="fs-4 m-0 fw-bold">Post</h1>
                    </div>

                    <button id="refreshPostCommentsBtn"
                        class="btn btn-outline-secondary rounded-pill d-flex align-items-center justify-content-center"
                        style="width: 36px; height: 36px; padding: 0; background: var(--surface-color); border-color: var(--line-color); color: var(--text-muted);"
                        title="Atualizar comentários" type="button">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="refresh-icon">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </header>

                <div id="main-post-container" class="single-post-view">
                    <p class="text-center text-muted py-4">Carregando publicação...</p>
                </div>

                <div id="post-comments-list" class="d-flex flex-column">
                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/post-ui.js"></script>
    <script src="../assets/js/post.js"></script>
</body>

</html>
