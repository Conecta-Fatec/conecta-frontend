<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="../assets/img/logotype-light.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
    <title>Conecta Fatec | Post</title>

  <meta name="apple-mobile-web-app-title" content="Conecta Fatec" />
  <meta name="application-name" content="Conecta Fatec" />
  <meta name="theme-color" content="#0f172a" />

<script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = '../index.html';
        }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/style-responsive-animations.css" />
</head>

<body class="theme-light">
    <script>
    (function () {
      const themeKey = 'conecta_theme_mode';
      const fontFamilyKey = 'conecta_font_family';
      const fontSizeKey = 'conecta_font_size';

      const fontFamilies = {
        inter: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        system: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
        serif: 'Georgia, "Times New Roman", serif',
        mono: '"Cascadia Code", "Fira Code", Consolas, monospace',
        rounded: '"Trebuchet MS", "Segoe UI", system-ui, sans-serif'
      };

      const fontSizes = { small: '87.5%', normal: '100%', large: '112.5%', xlarge: '125%' };
      const savedTheme = localStorage.getItem(themeKey);
      const resolvedTheme = savedTheme === 'dark' ? 'dark' : 'light';
      const fontFamily = fontFamilies[localStorage.getItem(fontFamilyKey)] || fontFamilies.inter;
      const fontSize = fontSizes[localStorage.getItem(fontSizeKey)] || fontSizes.normal;

      document.documentElement.classList.remove('theme-light', 'theme-dark');
      document.documentElement.classList.add('theme-' + resolvedTheme);
      document.documentElement.style.setProperty('font-size', fontSize);
      document.documentElement.style.setProperty('--app-font-family', fontFamily);
      document.documentElement.style.setProperty('--app-font-size', '1rem');

      function applyBodyPreferences() {
        if (!document.body) return;
        document.body.classList.remove('theme-light', 'theme-dark');
        document.body.classList.add('theme-' + resolvedTheme);
        document.body.style.setProperty('--app-font-family', fontFamily);
        document.body.style.setProperty('--app-font-size', '1rem');
      }

      applyBodyPreferences();
      document.addEventListener('DOMContentLoaded', applyBodyPreferences, { once: true });
    })();
  </script>

    <main class="feed-page">
        <div class="feed-layout">

            <aside class="sidebar desktop-sidebar">
                <a href="feed.html" class="sidebar-logo">
                    <img src="../assets/img/logo-light.svg" alt="Logo Conecta Fatec"
                        class="sidebar-logo-img logo-light" decoding="async" />
                    <img src="../assets/img/logo-dark.svg" alt="Logo Conecta Fatec"
                        class="sidebar-logo-img logo-dark" decoding="async" />
                </a>

                <nav class="sidebar-nav">
                    <a href="feed.html" class="sidebar-link">Feed</a>
                    <a href="profile.html" class="sidebar-link">Perfil</a>
                    <a href="communities.html" class="sidebar-link">Comunidades</a>
                    <a href="friends.html" class="sidebar-link">Amizades</a>
                    <a href="notifications.html" class="sidebar-link">Notificações</a>
                    <a href="settings.html" class="sidebar-link">Configurações</a>
                    <a href="about.html" class="sidebar-link">Sobre</a>
                </nav>

                <div class="sidebar-actions">
                    <a href="profile.html" class="logged-user">

            <section class="feed-content position-relative">

                <header class="single-post-header">
                    <div class="single-post-title-row">
                        <button class="back-btn" onclick="history.back()" aria-label="Voltar">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                            </svg>
                        </button>
                        <h1 class="fs-4 m-0 fw-bold">Post</h1>
                    </div>

                    <button id="refreshPostCommentsBtn"
                        class="btn btn-outline-secondary rounded-pill d-flex align-items-center justify-content-center"
                        style="width: 36px; height: 36px; padding: 0; background: var(--surface-color); border-color: var(--line-color); color: var(--text-muted);"
                        title="Atualizar comentários" type="button">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="refresh-icon">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                    </button>
                </header>

                <div id="main-post-container" class="single-post-view">
                    <p class="text-center text-muted py-4">Carregando publicação...</p>
                </div>

                <div id="post-comments-list" class="d-flex flex-column">
                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
