<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="../assets/img/logotype-light.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />
  <title>Conecta Fatec | Usuário</title>

  <meta name="apple-mobile-web-app-title" content="Conecta Fatec" />
  <meta name="application-name" content="Conecta Fatec" />
  <meta name="theme-color" content="#0f172a" />

  <script src="../assets/js/theme-boot.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/style-responsive-animations.css" />
</head>
<body>

  <main class="feed-page">
    <div class="feed-layout">
<aside class="sidebar desktop-sidebar modern-sidebar">
  <a href="feed.html" class="sidebar-logo">
    <img src="../assets/img/logo-light.svg" alt="Logo Conecta Fatec" class="sidebar-logo-img logo-light"
      decoding="async" />
    <img src="../assets/img/logo-dark.svg" alt="Logo Conecta Fatec" class="sidebar-logo-img logo-dark"
      decoding="async" />
  </a>

  <nav class="sidebar-nav modern-nav">
    <a href="feed.html" class="sidebar-link">
      <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Feed</span>
    </a>
    <a href="communities.html" class="sidebar-link">
      <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Comunidades</span>
    </a>
    <a href="friends.html" class="sidebar-link">
      <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="23" y1="11" x2="17" y2="11"></line>
      </svg>
      <span>Amizades</span>
    </a>
    <a href="notifications.html" class="sidebar-link">
      <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span>Notificações</span>
    </a>
    <a href="settings.html" class="sidebar-link">
      <svg class="nav-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <span>Configurações</span>
    </a>
  </nav>
  <div class="sidebar-actions modern-sidebar-actions">
    <button class="logged-user user-menu-pill" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      <div class="user-info-wrapper">
        <div class="user-avatar" id="sidebar-avatar">--</div>
        <div class="user-details">
          <strong id="sidebar-name">Carregando...</strong>
          <span id="sidebar-username">@usuario</span>
        </div>
      </div>
      <svg class="more-options-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <circle cx="5" cy="12" r="2.2"></circle>
        <circle cx="12" cy="12" r="2.2"></circle>
        <circle cx="19" cy="12" r="2.2"></circle>
      </svg>
    </button>

    <ul class="dropdown-menu user-dropdown-menu shadow">
      <li>
        <a class="dropdown-item" href="profile.html">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Ver perfil
        </a>
      </li>
      <li>
        <hr class="dropdown-divider">
      </li>
      <li>
        <a class="dropdown-item text-danger" href="../index.html" onclick="localStorage.removeItem('access_token');">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sair da conta
        </a>
      </li>
    </ul>
  </div>
</aside>

      <section class="feed-content community-page-content">
        <header class="community-page-hero profile-hero-card public-profile-skeleton" id="public-profile-hero" aria-busy="true">
          <div class="profile-hero-layout">
            <button class="community-page-avatar profile-main-avatar profile-skeleton-avatar" id="public-avatar" type="button" data-photo-viewer="public-profile" aria-label="Abrir foto de perfil"><span class="profile-skeleton-dot" aria-hidden="true"></span></button>
            <div class="community-page-info profile-main-info">
              <span class="feed-kicker">Perfil de Usuário</span>
              <h1 id="public-name"><span class="profile-skeleton-line profile-skeleton-title" aria-hidden="true"></span></h1>
              <span id="public-nickname" class="nickname-badge"><span class="profile-skeleton-line profile-skeleton-chip" aria-hidden="true"></span></span>
              <div class="profile-stat-row">
                <span id="public-friends-count"><span class="profile-skeleton-line profile-skeleton-stat" aria-hidden="true"></span></span>
                <span id="public-posts-count"><span class="profile-skeleton-line profile-skeleton-stat" aria-hidden="true"></span></span>
              </div>
              <p id="public-course" class="profile-course-text"><span class="profile-skeleton-line profile-skeleton-text-md" aria-hidden="true"></span></p>
              <p id="public-bio" class="profile-bio-text"><span class="profile-skeleton-line profile-skeleton-text-lg" aria-hidden="true"></span></p>
            </div>
            <div class="profile-action-group" id="friendActionGroup">
              <button type="button" class="btn btn-primary" id="friendActionBtn" style="display:none;">Adicionar</button>
              <button type="button" class="btn btn-outline-danger" id="rejectFriendActionBtn" style="display:none;">Recusar amizade</button>
            </div>
          </div>
        </header>

        <div class="community-page-layout profile-page-layout">
          <section class="community-main profile-api-grid">
            <article class="profile-api-card">
              <div class="d-flex justify-content-between align-items-center mb-3 gap-3 flex-wrap">
                <h2 class="h5 fw-bold mb-0">Publicações</h2>
                <small class="text-muted">Clique em um post para abrir no feed ou na comunidade.</small>
              </div>
              <div id="public-posts-container" class="d-flex flex-column gap-3">
                <div class="profile-post-skeleton-card" aria-hidden="true">
                  <span class="profile-skeleton-avatar-sm"></span>
                  <span class="profile-post-skeleton-body">
                    <span class="profile-skeleton-line profile-skeleton-text-md"></span>
                    <span class="profile-skeleton-line profile-skeleton-text-sm"></span>
                    <span class="profile-skeleton-line profile-skeleton-text-lg"></span>
                  </span>
                </div>
                <div class="profile-post-skeleton-card" aria-hidden="true">
                  <span class="profile-skeleton-avatar-sm"></span>
                  <span class="profile-post-skeleton-body">
                    <span class="profile-skeleton-line profile-skeleton-text-md"></span>
                    <span class="profile-skeleton-line profile-skeleton-text-sm"></span>
                    <span class="profile-skeleton-line profile-skeleton-text-lg"></span>
                  </span>
                </div>
              </div>
            </article>
          </section>

          <aside class="community-side profile-side-stack">
            <section class="profile-api-card mb-3">
              <h2 class="h5 fw-bold mb-3">Comunidades</h2>
              <div id="public-communities-container" class="d-flex flex-column gap-2">
                <div class="profile-side-skeleton-item" aria-hidden="true"><span></span><div><b></b><small></small></div></div>
                <div class="profile-side-skeleton-item" aria-hidden="true"><span></span><div><b></b><small></small></div></div>
              </div>
            </section>
            <section class="profile-api-card">
              <h2 class="h5 fw-bold mb-3">Amizades</h2>
              <div id="public-friends-container" class="profile-friends-list">
                <div class="profile-side-skeleton-item" aria-hidden="true"><span></span><div><b></b><small></small></div></div>
                <div class="profile-side-skeleton-item" aria-hidden="true"><span></span><div><b></b><small></small></div></div>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/post-ui.js"></script>
  <script src="../assets/js/profileuser.js"></script>
</body>
</html>
